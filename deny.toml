# SPDX-License-Identifier: GPL-3.0-or-later
# Dependency policy (ADR 0010): only licenses compatible with GPL-3.0-or-later.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Root certificates used by the WebDriver client in the end-to-end tests only (thirtyfour ->
# reqwest). The test crate is never shipped; the license is a permissive data license.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (not vulnerable); it comes in through Leptos (`either_of`). Revisit
    # when upgrading Leptos.
    { id = "RUSTSEC-2024-0436", reason = "transitive via Leptos, compile-time macro only" },
]
