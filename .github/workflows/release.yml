# SPDX-License-Identifier: GPL-3.0-or-later
# A release for a version tag (`v0.2.0`), attached to a GitHub release: the device's card image and
# its signed system update (ADR 0013, ADR 0022), built natively on an arm64 runner, and the
# desktop program for Windows (ADR 0020).
#
# The signing secret is `SURSUM_BUNDLE_SIGNING_KEY` in the `release` environment, which only
# `main` and `v*` tags may use; it is written to a file readable by the runner user only. The
# public key is the repository variable `SURSUM_BUNDLE_KEY`, compiled into the server, which is
# how devices decide which updates to trust; `just image` checks the update against it. The
# administrator's SSH public key is the repository variable `SURSUM_SSH_PUBKEY`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # MSVC links the WebView2 loader into the program, so it is one file; only a Windows runner
  # builds that. Unsigned: SmartScreen warns once, the operator guide explains it.
  desktop-windows:
    name: Desktop program for Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: just,trunk@0.22.1,wasm-bindgen-cli@0.2.130
      - run: just desktop-windows
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: target/x86_64-pc-windows-msvc/release/sursum.exe

  release:
    name: Device image and update, publish
    runs-on: ubuntu-24.04-arm
    needs: desktop-windows
    environment: release
    timeout-minutes: 90
    steps:
      - name: Free disk space (preinstalled SDKs this project does not use)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          # `git describe` (the version, and the build id the apps compare) needs the history.
          fetch-depth: 0
      - run: rustup show
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,trunk@0.22.1,wasm-bindgen-cli@0.2.130,cargo-zigbuild@0.24.1
      - name: Podman
        run: command -v podman || (sudo apt-get update && sudo apt-get install -y --no-install-recommends podman)
      - name: Build and sign the image and the system update
        env:
          SURSUM_BUNDLE_KEY: ${{ vars.SURSUM_BUNDLE_KEY }}
          SIGNING_KEY: ${{ secrets.SURSUM_BUNDLE_SIGNING_KEY }}
          SURSUM_SSH_PUBKEY: ${{ vars.SURSUM_SSH_PUBKEY }}
          SURSUM_PODMAN: sudo podman
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo "the signing secret is missing"; exit 1; }
          test -n "$SURSUM_SSH_PUBKEY" || { echo "the SURSUM_SSH_PUBKEY variable is missing"; exit 1; }
          key_file="$RUNNER_TEMP/update-signing.key"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s' "$SIGNING_KEY" > "$key_file")
          SURSUM_BUNDLE_SIGNING_KEY="$key_file" just image
      - uses: actions/download-artifact@v7
        with:
          name: desktop-windows
          path: target/desktop-windows
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(git describe --always --dirty)"
          cp target/desktop-windows/sursum.exe "target/sursum-$version-windows-x86_64.exe"
          cp target/image/work/deploy-*/sursum.img.zst "target/sursum-$version.img.zst"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "target/sursum-$version.img.zst" \
            "target/sursum-system-$version.sursum-system" \
            "target/sursum-$version-windows-x86_64.exe"
