# SPDX-License-Identifier: GPL-3.0-or-later
# A release for a version tag (`v0.2.0`): the signed application bundle for the Pi (ADR 0013), the
# Windows pilot binary and the desktop program for Windows (ADR 0020), attached to a GitHub
# release.
#
# The signing secret is `SURSUM_BUNDLE_SIGNING_KEY` in the `release` environment, which only
# `main` and `v*` tags may use; it is written to a file readable by the runner user only and
# removed at the end. The public key is the repository variable `SURSUM_BUNDLE_KEY`, compiled
# into the binary, which is how devices decide which bundles to trust.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # MSVC links the WebView2 loader into the program, so it is one file; only a Windows runner
  # builds that. Unsigned: SmartScreen warns once, the operator guide explains it.
  desktop-windows:
    name: Desktop program for Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1,wasm-bindgen-cli@0.2.130
      - name: Build (web apps and program with one build id)
        shell: bash
        run: |
          set -euo pipefail
          export SURSUM_BUILD_ID="$(git describe --always --dirty)"
          (cd apps/screen && trunk build --release)
          (cd apps/remote && trunk build --release)
          cargo build --release -p sursum-desktop --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: target/x86_64-pc-windows-msvc/release/sursum.exe

  release:
    name: Signed bundle and Windows binaries
    runs-on: ubuntu-24.04
    needs: desktop-windows
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          # `git describe` (the build id the apps compare) needs the tag and its history.
          fetch-depth: 0
      - run: rustup show
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,trunk@0.22.1,wasm-bindgen-cli@0.2.130,cargo-zigbuild@0.24.1
      - name: Build and sign the bundle
        env:
          SURSUM_BUNDLE_KEY: ${{ vars.SURSUM_BUNDLE_KEY }}
          SIGNING_KEY: ${{ secrets.SURSUM_BUNDLE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SURSUM_BUNDLE_KEY" || { echo "the SURSUM_BUNDLE_KEY variable is missing"; exit 1; }
          test -n "$SIGNING_KEY" || { echo "the signing secret is missing"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          key_file="$RUNNER_TEMP/bundle-signing.key"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s' "$SIGNING_KEY" > "$key_file")
          SURSUM_BUNDLE_SIGNING_KEY="$key_file" just app-bundle "$version"
          # A secret that does not match the public key would make bundles every device refuses.
          cargo run -q -p sursum-server -- bundle verify "target/sursum-$version.sursum-app"
      - run: just cross-win
        env:
          SURSUM_BUNDLE_KEY: ${{ vars.SURSUM_BUNDLE_KEY }}
      - uses: actions/download-artifact@v7
        with:
          name: desktop-windows
          path: target/desktop-windows
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp target/x86_64-pc-windows-gnu/release/sursum-server.exe "target/sursum-server-$version-windows-x86_64.exe"
          cp target/desktop-windows/sursum.exe "target/sursum-$version-windows-x86_64.exe"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "target/sursum-$version.sursum-app" \
            "target/sursum-server-$version-windows-x86_64.exe" \
            "target/sursum-$version-windows-x86_64.exe"
