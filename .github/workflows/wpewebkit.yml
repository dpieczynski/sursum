# SPDX-License-Identifier: GPL-3.0-or-later
# WPE WebKit 2.54 for Debian 13 trixie on arm64, the screen's engine (ADR 0027): Debian's own
# source package from sid, rebuilt unchanged against trixie in a trixie container on a native arm64
# runner. Trixie itself stays at 2.48 (Debian never rebases it). The packages are kept as this
# run's artifact `wpewebkit-debs`. A release installs only those of the latest run on main started
# by a push or by hand (`just wpe-debs`, release.yml); a pull request's run serves its trial image
# (image.yml) only. Runs when this file changes, in a pull request and again on main once merged.
# Artifacts expire after 90 days, so run this by hand on main before then, and when sid has a new
# version.
name: WPE WebKit for trixie

on:
  pull_request:
    paths:
      - ".github/workflows/wpewebkit.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wpewebkit.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Debian source version of wpewebkit in sid"
        default: "2.54.3-1"

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '2.54.3-1' }}

jobs:
  build:
    name: wpewebkit (trixie, arm64)
    runs-on: ubuntu-24.04-arm
    # About 2.5 hours on four cores reported; the job limit is six.
    timeout-minutes: 350
    container: docker.io/library/debian:trixie
    steps:
      - name: Source from sid, build dependencies from trixie
        run: |
          set -eu
          # Only source lines for sid: every binary package still comes from trixie.
          printf 'Types: deb-src\nURIs: http://deb.debian.org/debian\nSuites: sid\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\n' \
            > /etc/apt/sources.list.d/sid-src.sources
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev devscripts ca-certificates
          mkdir -p /build && cd /build
          apt-get source --download-only "wpewebkit=$VERSION"
          dpkg-source -x wpewebkit_*.dsc src
          cd src
          # Marks the packages as a local trixie rebuild (lower than any official 2.54.3-1).
          DEBEMAIL=sursum@localhost DEBFULLNAME="sursum CI" \
            dch --local '~deb13sursum' --distribution trixie "Rebuilt for trixie arm64 (sursum screen, ADR 0027)."
          apt-get build-dep -y --no-install-recommends -Pnodoc .
      - name: Build (architecture-dependent packages, no docs, no tests)
        working-directory: /build/src
        run: |
          set -eu
          export DEB_BUILD_PROFILES=nodoc
          export DEB_BUILD_OPTIONS="nocheck nodoc noautodbgsym parallel=$(nproc)"
          free -h; nproc; df -h /
          dpkg-buildpackage -B -uc -us
      - name: Collect
        run: |
          set -eu
          mkdir -p /build/out
          cp /build/*.deb /build/out/
          ls -l /build/out
          dpkg-deb -c /build/out/libwpewebkit-2.0-1_*.deb | grep -E 'MiniBrowser|libWPEWebKit|WPEWebProcess'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpewebkit-debs
          path: /build/out/*.deb
          retention-days: 90
