# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Line numbers in backtraces are enough in CI; full debug info made the test binaries and the
  # cache fill the runner's disk (the linker died with a bus error).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space (preinstalled SDKs this project does not use)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show
      - name: GTK 4 and WebKitGTK 6.0 for the desktop program's Linux window (ADR 0020)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus libgl1-mesa-dri
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,trunk@0.22.1,wasm-bindgen-cli@0.2.130,leptosfmt@0.1.33,cargo-deny@0.20.2,cargo-about@0.9.3,cargo-zigbuild@0.24.1
      - run: just lint
      - run: just licenses-check
      - run: just test
      - run: just build
      - name: WebAssembly size report
        run: ls -l apps/*/dist/*.wasm
      - name: Desktop program on Linux (best effort, ADR 0020)
        # The runner forbids unprivileged user namespaces (AppArmor), which WebKitGTK's
        # bubblewrap sandbox needs; desktops allow them for bwrap.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          just desktop && dbus-run-session -- xvfb-run -a scripts/desktop-smoke.sh target/release/sursum

  e2e:
    name: End-to-end (Chromium and WPE WebKit)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - name: Free disk space (preinstalled SDKs this project does not use)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,trunk@0.22.1,wasm-bindgen-cli@0.2.130
      - run: just browsers-image
      - run: just browsers
      - run: just test-wasm
      - run: just e2e
      - if: always()
        run: just browsers-stop

  cross:
    name: Cross-compile (Raspberry Pi)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,trunk@0.22.1,wasm-bindgen-cli@0.2.130,cargo-zigbuild@0.24.1
      - run: just cross-pi
      - uses: actions/upload-artifact@v7
        with:
          name: sursum-server-${{ github.sha }}
          path: target/aarch64-unknown-linux-gnu/release/sursum-server

  # The desktop program for Windows (ADR 0020): MSVC links the WebView2 loader statically, so
  # people get one file. Built here, not cross-compiled, because only MSVC does that.
  desktop-windows:
    name: Desktop program (Windows)
    runs-on: windows-2025
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1,wasm-bindgen-cli@0.2.130
      - name: Build (web apps and program with one build id)
        shell: bash
        run: |
          set -euo pipefail
          export SURSUM_BUILD_ID="$(git describe --always --dirty)"
          (cd apps/screen && trunk build --release)
          (cd apps/remote && trunk build --release)
          cargo build --release -p sursum-desktop --target x86_64-pc-windows-msvc
      - name: One file (no DLLs beyond what Windows itself has)
        # The runner has the Visual C++ Redistributable; ordinary PCs do not.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $dependents = & $dumpbin /nologo /dependents target\x86_64-pc-windows-msvc\release\sursum.exe
          $dependents
          $extra = $dependents | Select-String -Pattern '(?i)^\s+(vcruntime|msvcp|webview2loader)\S*\.dll'
          if ($extra) { throw "the program needs DLLs Windows does not ship: $extra" }
      - name: Smoke test (the remote in the WebView2 window connects)
        # Non-blocking until it has proven reliable on hosted runners.
        continue-on-error: true
        shell: pwsh
        run: |
          $env:RUST_LOG = 'info,sursum_server::ws=debug'
          $program = Start-Process -FilePath target\x86_64-pc-windows-msvc\release\sursum.exe -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'sursum\sursum.log'
          $connected = $false
          for ($i = 0; $i -lt 60 -and -not $connected; $i++) {
            Start-Sleep -Seconds 1
            $connected = (Test-Path $log) -and (Select-String -Path $log -Pattern 'client connected.*role=Remote' -Quiet)
          }
          Stop-Process -Id $program.Id -ErrorAction SilentlyContinue
          if (Test-Path $log) { Get-Content $log }
          if (-not $connected) { throw 'the remote did not connect' }
      - uses: actions/upload-artifact@v7
        with:
          name: sursum-windows-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/sursum.exe
