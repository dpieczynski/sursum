# SPDX-License-Identifier: GPL-3.0-or-later
# The remote in Safari on an iPad Simulator (roadmap P2). macOS minutes are expensive on a private
# repository, so this runs by hand and once a week, not on every pull request; it does not block
# anything while it is new. The screen runs in Chrome (safaridriver holds one session), the
# remotes in Safari through safaridriver; the server is the same binary as everywhere else.
name: iPad

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  ipad:
    name: Remote in Safari on the iPad Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1,wasm-bindgen-cli@0.2.130
      - name: Build the web apps and the server with one build id
        run: |
          set -euo pipefail
          export SURSUM_BUILD_ID="$(git describe --always --dirty)"
          echo "SURSUM_BUILD_ID=$SURSUM_BUILD_ID" >> "$GITHUB_ENV"
          (cd apps/screen && trunk build --release)
          (cd apps/remote && trunk build --release)
          cargo build -p sursum-server --features e2e-hooks
      - name: Boot an iPad Simulator and start the WebDriver servers
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          ipad="$(xcrun simctl list devices available | grep -m1 -E '^\s+iPad' | grep -oE '[0-9A-F-]{36}')"
          echo "booting $ipad"
          xcrun simctl boot "$ipad"
          xcrun simctl bootstatus "$ipad" -b
          sudo safaridriver --enable
          safaridriver -p 4444 &
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 &
          sleep 3
      - name: Remote tests (Safari on the iPad, the screen in Chrome)
        continue-on-error: true
        env:
          SURSUM_E2E_BROWSER: chromium
          SURSUM_E2E_REMOTE_BROWSER: safari-ipad
          SURSUM_CHROMIUM_BINARY: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: >
          cargo test -p sursum-e2e --no-fail-fast
          --test remote_library --test remote --test remote_sets --test remote_live
          -- --ignored --test-threads=1
