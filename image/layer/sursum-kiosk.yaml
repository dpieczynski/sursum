# METABEGIN
# X-Env-Layer-Name: sursum-kiosk
# X-Env-Layer-Version: 0.2.0
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: The screen (ADR 0027): WebKit's MiniBrowser from our trixie rebuild of WPE
#  WebKit 2.54 on the DRM platform, run by its own user, without a compositor. The kiosk unit
#  starts the browser only once the server answers.
# X-Env-Layer-Requires: sursum-device
#
# X-Env-VarPrefix: sursum
#
# X-Env-Var-wpe_debs:
# X-Env-Var-wpe_debs-Desc: Folder with the rebuilt packages (the wpewebkit-debs artifact of
#  .github/workflows/wpewebkit.yml, fetched by `just wpe-debs`); `just image` passes it.
# X-Env-Var-wpe_debs-Required: y
# X-Env-Var-wpe_debs-Valid: string
# X-Env-Var-wpe_debs-Set: y
# METAEND
---
# SPDX-License-Identifier: GPL-3.0-or-later
mmdebstrap:
  customize-hooks:
    # The library package holds MiniBrowser; apt takes its dependencies from trixie. The package
    # does not declare what MiniBrowser and the web process sandbox need at run time: the
    # library libWPEBackend-fdo-1.0.so.1 (only suggested; the first spike image failed on the Pi
    # without it), /usr/bin/bwrap and /usr/bin/xdg-dbus-proxy, which WebKit starts the web
    # process with, and libGLESv2.so.2, which libepoxy loads at run time (the second spike image's
    # web process died without it). They are named here, and the build fails if any of it is
    # still missing.
    - |
      set -eu
      debs="${IGconf_sursum_wpe_debs}"
      ls "$debs"/libwpewebkit-2.0-1_*.deb >/dev/null
      mkdir -p $1/tmp/wpe
      cp "$debs"/libwpewebkit-2.0-1_*.deb $1/tmp/wpe/
      chroot $1 sh -c 'apt-get update && apt-get install -y --no-install-recommends /tmp/wpe/*.deb libwpebackend-fdo-1.0-1 bubblewrap xdg-dbus-proxy libgles2'
      rm -rf $1/tmp/wpe
      browser=/usr/lib/aarch64-linux-gnu/wpe-webkit-2.0/MiniBrowser
      test -x $1$browser
      test -x $1/usr/bin/bwrap
      test -x $1/usr/bin/xdg-dbus-proxy
      test -e $1/usr/lib/aarch64-linux-gnu/libGLESv2.so.2
      if chroot $1 ldd $browser | grep 'not found'; then
        echo "MiniBrowser misses the libraries above" >&2
        exit 1
      fi
    - chroot $1 useradd --system --create-home --home-dir /var/lib/sursum-kiosk --shell /usr/sbin/nologin sursum-kiosk
    - install -m 0644 ../deploy/kiosk/sursum-kiosk.service $1/etc/systemd/system/sursum-kiosk.service
    # The kiosk starts the browser only once the server answers (sursum-kiosk.service).
    - install -D -m 0755 ../deploy/kiosk/wait-for-server $1/usr/lib/sursum/wait-for-server
    # The screen guard's restart requests (see /etc/sursum/config.toml).
    - install -m 0644 ../deploy/kiosk/sursum-kiosk-restart.path ../deploy/kiosk/sursum-kiosk-restart.service $1/etc/systemd/system/
    # tty1 belongs to the screen: no login prompt there.
    - rm -f $1/etc/systemd/system/getty.target.wants/getty@tty1.service
    - $BDEBSTRAP_HOOKS/enable-units "$1" sursum-kiosk sursum-kiosk-restart.path
