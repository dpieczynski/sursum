# METABEGIN
# X-Env-Layer-Name: sursum-kiosk-wpe
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: The screen for the WPE-on-DRM spike (ADR 0009 amendment of 2026-11-19):
#  WebKit's MiniBrowser from our trixie rebuild of WPE WebKit 2.54 on the DRM platform, run by
#  its own user, without cage, seatd, wlr-randr, Chromium policies or cursor themes. Replaces
#  sursum-kiosk with `just image n wpe`; never in a shipped image until an ADR decides.
# X-Env-Layer-Requires: sursum-device
#
# X-Env-VarPrefix: sursum
#
# X-Env-Var-wpe_debs:
# X-Env-Var-wpe_debs-Desc: Folder with the rebuilt packages (the wpewebkit-debs artifact of
#  .github/workflows/wpewebkit.yml); `just image n wpe` passes it.
# X-Env-Var-wpe_debs-Required: y
# X-Env-Var-wpe_debs-Valid: string
# X-Env-Var-wpe_debs-Set: y
# METAEND
---
# SPDX-License-Identifier: GPL-3.0-or-later
mmdebstrap:
  customize-hooks:
    # The library package holds MiniBrowser; apt takes its dependencies from trixie.
    - |
      set -eu
      debs="${IGconf_sursum_wpe_debs}"
      ls "$debs"/libwpewebkit-2.0-1_*.deb >/dev/null
      mkdir -p $1/tmp/wpe
      cp "$debs"/libwpewebkit-2.0-1_*.deb $1/tmp/wpe/
      chroot $1 sh -c 'apt-get update && apt-get install -y --no-install-recommends /tmp/wpe/*.deb'
      rm -rf $1/tmp/wpe
      test -x $1/usr/lib/aarch64-linux-gnu/wpe-webkit-2.0/MiniBrowser
    - chroot $1 useradd --system --create-home --home-dir /var/lib/sursum-kiosk --shell /usr/sbin/nologin sursum-kiosk
    - install -m 0644 ../deploy/kiosk/sursum-kiosk-wpe.service $1/etc/systemd/system/sursum-kiosk.service
    # The screen guard's restart requests (see /etc/sursum/config.toml).
    - install -m 0644 ../deploy/kiosk/sursum-kiosk-restart.path ../deploy/kiosk/sursum-kiosk-restart.service $1/etc/systemd/system/
    # tty1 belongs to the screen: no login prompt there.
    - rm -f $1/etc/systemd/system/getty.target.wants/getty@tty1.service
    - $BDEBSTRAP_HOOKS/enable-units "$1" sursum-kiosk sursum-kiosk-restart.path
