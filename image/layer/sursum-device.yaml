# METABEGIN
# X-Env-Layer-Name: sursum-device
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: The sursum server and the device around it (ADR 0013, ADR 0022): the server
#  in the read-only system, its user and unit, /var/lib/sursum shared by both system slots, the
#  persistent partition grown to fill the card, mDNS (sursum.local and the _sursum._tcp
#  service the Android launcher looks for), a local-network-only firewall, the hardware
#  watchdog, a small persistent journal, a silent black boot and Ethernet only. Hooks run in
#  the image source directory (image/), so ../deploy is the repository's deploy folder: one
#  copy of every unit.
#
# X-Env-VarPrefix: sursum
#
# X-Env-Var-server:
# X-Env-Var-server-Desc: Path of the server built for the Pi (`just image` passes it), installed
#  as /usr/lib/sursum/sursum-server. Later versions come with system updates (ADR 0022).
# X-Env-Var-server-Required: y
# X-Env-Var-server-Valid: string
# X-Env-Var-server-Set: y
#
# X-Env-Var-system_version:
# X-Env-Var-system_version-Desc: The system's version (the build's git describe), written to
#  /etc/sursum/system-release and into the matching .sursum-system (`just image` passes it).
# X-Env-Var-system_version-Required: y
# X-Env-Var-system_version-Valid: string
# X-Env-Var-system_version-Set: y
#
# X-Env-Var-diagnostic_boot: n
# X-Env-Var-diagnostic_boot-Desc: y shows kernel and systemd messages and the firmware's rainbow
#  screen instead of a black boot, for diagnosing a device that never shows the screen
#  (`just image <version> y`). Never for a device in a church.
# X-Env-Var-diagnostic_boot-Required: n
# X-Env-Var-diagnostic_boot-Valid: bool
# X-Env-Var-diagnostic_boot-Set: y
# METAEND
---
# SPDX-License-Identifier: GPL-3.0-or-later
mmdebstrap:
  packages:
    - avahi-daemon
    - nftables
    # sfdisk, partx and resize2fs for growing /persistent to fill the card (not in minbase).
    - fdisk
    - e2fsprogs
  customize-hooks:
    # The server's user owns /var/lib/sursum (a system user: /etc is read-only on the device).
    - chroot $1 useradd --system --home-dir /var/lib/sursum --shell /usr/sbin/nologin sursum
    - install -m 0644 ../deploy/systemd/sursum.service $1/etc/systemd/system/sursum.service
    # The server is part of the read-only system (ADR 0022): root-owned, so neither a
    # compromised server process nor anything on the data partition can replace it, and the
    # root units that write system updates run this same binary. /var/lib/sursum (empty here)
    # is copied to the persistent partition on first boot.
    - |
      set -eu
      server="${IGconf_sursum_server}"
      test -f "$server" || { echo "sursum: no server at $server" >&2; exit 1; }
      install -D -m 0755 "$server" $1/usr/lib/sursum/sursum-server
      install -d -m 0750 $1/var/lib/sursum
      chroot $1 chown sursum:sursum /var/lib/sursum
    - |
      set -eu
      install -d -m 0755 $1/etc/sursum
      echo "${IGconf_sursum_system_version}" > $1/etc/sursum/system-release
    - $BDEBSTRAP_HOOKS/enable-units "$1" sursum avahi-daemon nftables sursum-grow-persistent sursum-system-update.path sursum-system-check sursum-system-finish
