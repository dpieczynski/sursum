# The Pi has no RTC battery and a church may have no time server, so the clock at boot is often
# months off. Without this, e2fsck treats superblock times "in the future" as a problem and may
# force full checks of /persistent on every boot (seen on the first boot of the image).
[options]
	broken_system_clock = 1
