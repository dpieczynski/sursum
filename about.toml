# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-about: third-party license notices shown at /licenses (ADR 0010). Keep in sync with
# deny.toml. Regenerate with `just licenses`.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
]
# Only what ships: the server, the desktop program (which contains it) and the two web apps (not
# tests or tools).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
